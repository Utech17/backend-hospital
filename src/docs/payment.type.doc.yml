/PaymentType:
  get:
    summary: Obtener todos los tipos de pago
    tags:
      - Tipos de pago
    description: Endpoint para obtener la lista de tipos de pago
    produces:
      - application/json
    responses:
      "200":
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      description:
                        type: string
                        example: "Cash"
                      status:
                        type: boolean
                        example: true
      "404":
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Registro no encontrado"
      "500":
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Error interno del servidor"
  post:
    summary: Crear un nuevo tipo de pago
    tags:
      - Tipos de pago
    description: Endpoint para crear un nuevo tipo de pago
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              description:
                type: string
                example: "Cash"
              status:
                type: boolean
                example: true
    responses:
      "201":
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    description:
                      type: string
                      example: "Cash"
                    status:
                      type: boolean
                      example: true
      "400":
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: string
                    example: "Error en un campo"
      "500":
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Error interno del servidor"

/PaymentType/{id}:
  get:
    summary: Obtener un tipo de pago
    tags:
      - Tipos de pago
    description: Endpoint para obtener un tipo de pago por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del tipo de pago
        schema:
          type: integer
    produces:
      - application/json
    responses:
      "200":
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    description:
                      type: string
                      example: "Cash"
                    status:
                      type: boolean
                      example: true
      "404":
        description: Registro no encontrado
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Registro no encontrado"
      "500":
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Error interno del servidor"
  put:
    summary: Actualizar un tipo de pago
    tags:
      - Tipos de pago
    description: Endpoint para actualizar un tipo de pago por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del tipo de pago
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              description:
                type: string
                example: "Cash"
              status:
                type: boolean
                example: true
    responses:
      "200":
        description: Actualización exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    description:
                      type: string
                      example: "Cash"
                    status:
                      type: boolean
                      example: true
      "400":
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: string
                    example: "Error en el campo X"
      "404":
        description: Registro no encontrado para actualizar
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Registro no encontrado para actualizar"
      "500":
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Error interno del servidor"
  delete:
    summary: Eliminar un tipo de pago
    tags:
      - Tipos de pago
    description: Endpoint para eliminar un tipo de pago
    parameters:
      - in: path
        name: id
        required: true
        description: Id del tipo de pago
        schema:
          type: integer
    responses:
      "200":
        description: Tipo de pago eliminado exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Tipo de pago eliminado exitosamente"
      "500":
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Error interno del servidor"            