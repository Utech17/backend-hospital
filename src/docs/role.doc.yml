/role:
  get:
    summary: Obtener todos los roles
    tags:
      - Roles
    description: Endpoint para obtener la lista de roles
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    roles:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "Administrador"
                          description:
                            type: string
                            example: "Rol con todos los permisos"
                          createdAt:
                            type: string
                            format: date-time
                            example: "2024-01-01T00:00:00.000Z"
                          updatedAt:
                            type: string
                            format: date-time
                            example: "2024-01-01T00:00:00.000Z"
      '404':
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros no encontrados
                data:
                  type: array
                  items: {}
                  example: []
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador
  post:
    summary: Crear un nuevo rol
    tags:
      - Roles
    description: Endpoint para crear un nuevo rol
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - description
            properties:
              name:
                type: string
                example: "Administrador"
              description:
                type: string
                example: "Rol con todos los permisos"
    responses:
      '201':
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Creación exitosa
                data:
                  type: object
                  properties:
                    role:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Administrador"
                        description:
                          type: string
                          example: "Rol con todos los permisos"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Name is required"
                      path:
                        type: string
                        example: "name"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador

/role/{id}:
  get:
    summary: Obtener un rol
    tags:
      - Roles
    description: Endpoint para obtener un rol por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del rol
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro encontrado
                data:
                  type: object
                  properties:
                    role:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Administrador"
                        description:
                          type: string
                          example: "Rol con todos los permisos"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
