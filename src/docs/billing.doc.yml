/billing:
  get:
    summary: Obtener todas las facturas
    tags:
      - billing
    description: Endpoint para obtener la lista de todas las facturas
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Facturas encontradas exitosamente
                data:
                  type: object
                  properties:
                    bills:
                      type: array
                      items:
                        $ref: '#/components/schemas/BillResponse'
      '404':
        description: No se encontraron facturas
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: No se encontraron facturas
                data:
                  type: object
                  properties: {}
      '500':
        $ref: '#/components/responses/ServerError'

  post:
    summary: Crear una nueva factura
    tags:
      - billing
    description: Endpoint para crear una nueva factura
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - patient_id
              - client_id
              - BillingDetails
            properties:
              patient_id:
                type: integer
                example: 1
              billing_date:
                type: string
                format: date
                example: "2024-03-17"
              billing_status:
                type: string
                enum: [pendiente, pagado, cancelado]
                example: "pagado"
              client_id:
                type: integer
                example: 1
              BillingDetails:
                type: array
                items:
                  type: object
                  required:
                    - product_id
                    - quantity
                    - price
                  properties:
                    product_id:
                      type: integer
                      example: 1
                    quantity:
                      type: integer
                      example: 2
                    price:
                      type: number
                      format: float
                      example: 15.50
              payment_type_id:
                type: integer
                example: 1
    responses:
      '201':
        description: Factura creada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura creada exitosamente
                status:
                  type: integer
                  example: 201
                data:
                  $ref: '#/components/schemas/BillCreateResponse'
      '400':
        description: Error en los datos de entrada
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Los campos patient_id y client_id son obligatorios
                status:
                  type: integer
                  example: 400
      '500':
        $ref: '#/components/responses/ServerError'

/billing/{id}:
  get:
    summary: Obtener una factura específica
    tags:
      - billing
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la factura
    responses:
      '200':
        description: Factura encontrada
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura encontrada
                data:
                  type: object
                  properties:
                    bill:
                      $ref: '#/components/schemas/BillResponse'
      '404':
        description: Factura no encontrada
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura no encontrada
                data:
                  type: object
                  properties: {}
      '500':
        $ref: '#/components/responses/ServerError'

  put:
    summary: Actualizar una factura
    tags:
      - billing
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la factura a actualizar
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BillUpdateRequest'
    responses:
      '200':
        description: Factura actualizada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura actualizada exitosamente
                data:
                  type: object
                  properties:
                    bill:
                      $ref: '#/components/schemas/BillResponse'
      '404':
        description: Factura no encontrada
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura no encontrada
      '500':
        $ref: '#/components/responses/ServerError'

  delete:
    summary: Eliminar una factura
    tags:
      - billing
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la factura a eliminar
    responses:
      '200':
        description: Factura eliminada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura eliminada exitosamente
                status:
                  type: integer
                  example: 200
                data:
                  type: object
                  properties: {}
      '404':
        description: Factura no encontrada
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Factura no encontrada
      '500':
        $ref: '#/components/responses/ServerError'

components:
  schemas:
    BillResponse:
      type: object
      properties:
        num_fact:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 1
        billing_date:
          type: string
          format: date-time
          example: "2024-12-01T00:00:00.000Z"
        billing_status:
          type: string
          example: "pagado"
        client_id:
          type: integer
          example: 1
        updatedAt:
          type: string
          format: date-time
          example: "2025-02-18T04:10:16.000Z"
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        billing_details:
          type: array
          items:
            $ref: '#/components/schemas/BillingDetail'
        sale:
          $ref: '#/components/schemas/Sale'
        Patient:
          $ref: '#/components/schemas/Patient'
        client:
          $ref: '#/components/schemas/Client'

    BillingDetail:
      type: object
      properties:
        billing_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 10
        price:
          type: string
          example: "15.50"
        num_fact:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        product:
          $ref: '#/components/schemas/Product'

    Sale:
      type: object
      properties:
        id:
          type: integer
          example: 1
        invoice_number:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
        amount:
          type: string
          example: "500.75"
        payment_type_id:
          type: integer
          example: 1
        status:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        payment_type:
          $ref: '#/components/schemas/PaymentType'

    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: "Jhei"
        firstName:
          type: string
          example: "Jheilyn"
        lastName:
          type: string
          example: "Ramirez"
        birthDate:
          type: string
          format: date-time
        gender:
          type: string
          example: "Female"
        identifier:
          type: string
          example: "1234567891"
        registrationDate:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    Client:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Pérez"
        email:
          type: string
          example: "juan.perez@example.com"
        phone_number:
          type: string
          example: "0412-123-4567"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Aspirina"
        description:
          type: string
          example: "Medicamento para el dolor y la fiebre"
        unit_measure:
          type: string
          example: "tabletas"
        quantity_xunit:
          type: integer
          example: 100
        weight:
          type: string
          example: "0.10"
        location:
          type: string
          example: "Farmacia - Estante A1"
        status:
          type: string
          example: "active"
        cod_type:
          type: integer
          example: 1
        cod_class:
          type: integer
          example: 1
        cod_pres:
          type: integer
          example: 1

    PaymentType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        description:
          type: string
          example: "Efectivo"
        status:
          type: boolean
          example: true

    BillCreateResponse:
      type: object
      properties:
        bill:
          type: object
          properties:
            num_fact:
              type: integer
              example: 7
            patient_id:
              type: integer
              example: 1
            billing_date:
              type: string
              format: date-time
            billing_status:
              type: string
              example: "pagado"
            client_id:
              type: integer
              example: 1
            updatedAt:
              type: string
              format: date-time
              nullable: true
            deletedAt:
              type: string
              format: date-time
              nullable: true
        billing_details:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 2
              price:
                type: number
                example: 15.5
              updatedAt:
                type: string
                format: date-time
              num_fact:
                type: integer
                example: 7
        sale:
          type: object
          properties:
            id:
              type: integer
              example: 4
            invoice_number:
              type: integer
              example: 7
            date:
              type: string
              format: date-time
            amount:
              type: number
              example: 31
            payment_type_id:
              type: integer
              example: 1
            status:
              type: boolean
              example: true
            updatedAt:
              type: string
              format: date-time
            deletedAt:
              type: string
              format: date-time
              nullable: true
        request:
          type: object
          properties:
            request_id:
              type: integer
              example: 7
            request_type_id:
              type: integer
              example: 2
            description:
              type: string
              example: "Venta al contado - Factura #7"
            amount:
              type: number
              example: 31
            status:
              type: string
              example: "aprobada"

    BillUpdateRequest:
      type: object
      properties:
        patient_id:
          type: integer
          example: 1
        billing_date:
          type: string
          format: date
          example: "2024-02-17"
        billing_status:
          type: string
          enum: [pendiente, pagado, cancelado]
          example: "pagado"
        client_id:
          type: integer
          example: 1
        BillingDetails:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 3
              price:
                type: number
                format: float
                example: 10.50
        payment_type_id:
          type: integer
          example: 1

  responses:
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Por favor, contacte al administrador
              status:
                type: integer
                example: 500 