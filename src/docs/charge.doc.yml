            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
  put:
    summary: "Actualizar un Cargo"
    tags:
      - "Cargos"
    description: "Endpoint para actualizar un cargo"
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: "integer"
          example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: "object"
            properties:
              charge_name:
                type: "string"
                example: "Médico de vacas"
              description:
                type: "string"
                example: "Experto en vacas"
              createdAt:
                type: "string"
                format: "date-time"
                example: "2055-02-04T02:53:49.000Z"
