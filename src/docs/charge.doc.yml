    responses:
      201:
        description: "Cargo actualizado"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Cargo actualizado"
                data:
                  type: "object"
                  properties:
                    charge:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
