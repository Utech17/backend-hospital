                          type: "string"
                          format: "date-time"
                          example: "2055-02-04T02:53:49.000Z"
                        updatedAt:
                          type: "string"
                          format: "date-time"
                          example: "2055-02-04T02:53:49.000Z"
      404:
        description: "Cargo no encontrado"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
