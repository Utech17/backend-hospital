        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
  delete:
    summary: "Eliminar un Cargo"
    tags:
      - "Cargos"
    description: "Endpoint para eliminar un cargo"
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: "integer"
          example: 1
    responses:
      204:
        description: "Eliminación exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Eliminación exitosa"
                data:
                  type: "object"
                  properties:
                    charge:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
                          example: 1
                        charge_name:
                          type: "string"
                          example: "Médico de vacas"
                        description:
                          type: "string"
                          example: "Experto en vacas"
                        createdAt:
                          type: "string"
                          format: "date-time"
                          example: "2055-02-04T02:53:49.000Z"
                        updatedAt:
                          type: "string"
                          format: "date-time"
                          example: "2055-02-04T02:53:49.000Z"
      404:
        description: "Registro no encontrado"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Registro no encontrado"
      500:
        description: "Error del servidor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"