/Presentation:
  get:
    summary: "Obtener presentations"
    tags:
      - "Presentation"
    medida: "Endpoint para obtener la lista de presentations"
    produces:
      - "application/json"
    responses:
      "200":
        medida: "Respuesta exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "presentations encontrados"
                data:
                  type: "object"
                  properties:
                    Presentation:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          cod_pres:
                            type: "integer"
                            example: 1
                          cantidad:
                            type: "string"
                            example: "10"
                          medida:
                            type: "string"
                            format: "50"
                            example: 50
                          Peso:
                            type: "string"
                            format: "50"
                            example: 50
                          status:
                            type: "boolean"
                            example: true
                          createdAt:
                            type: "string"
                            format: "date-time"
                            example: "2024-12-13T01:24:41.000Z"
                          updatedAt:
                            type: "string"
                            format: "date-time"
                            example: "2024-12-13T01:24:41.000Z"
      "404":
        medida: "Registros no encontrados"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "presentations no encontrados"
                data:
                  type: "object"
                  properties:
                    Presentation:
                      type: "array"
                      items: {}
                      example: []
      "500":
        medida: "Error interno del servcod_presor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
  post:
    summary: "Crear un nuevo Presentation"
    tags:
      - "Presentation" 
    medida: "Endpoint para crear un nuevo Presentation"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: "object"
            properties:
              cantidad:
                type: "string"
                example: "1"
    responses:
      201:
        medida: "Creación exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Creación exitosa"
                data:
                  type: "object"
                  properties:
                    Presentation:
                      type: "object"
                      properties:
                        status:
                          type: "boolean"
                          example: true
                        cod_pres:
                          type: "integer"
                          example: 21
                        cantidad:
                          type: "string"
                          example: "1"
                        medida:
                          type: "string"
                          format: "18"
                          example: 18                          
                        updatedAt:
                          type: "string"
                          format: "date-time"
                          example: "2025-02-01T00:20:51.550Z"
                        createdAt:
                          type: "string"
                          format: "date-time"
                          example: "2025-02-01T00:20:51.550Z"
      400:
        medida: "Error en la solicitud"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                errors:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      type:
                        type: "string"
                        example: "field"
                      msg:
                        type: "string"
                        example: "Presentation cantidad is required"
                      path:
                        type: "string"
                        example: "cantidad"
                      location:
                        type: "string"
                        example: "body"
      500:
        medida: "Error del servcod_presor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
