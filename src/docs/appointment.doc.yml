      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Respuesta exitosa 
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cita encontrada exitosamente
                  data:
                    type: object
                    properties:
                      appointment:
                        type: object
                        properties:
                          id:
                            type: integer
                          patient_id:
                            type: integer
                          employee_id:
                            type: integer
                          appointment_date:
                            type: string
                            format: date-time
                          appointment_status:
                            type: string
                            enum: [Scheduled, Completed, Cancelled]
                          appointment_area:
                            type: string
