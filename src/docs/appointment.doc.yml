              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: field
                        msg:
                          type: string
                        path:
                          type: string
                        location:
                          type: string
        '404':
          description: Cita no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cita no encontrada
                  status:
                    type: integer
                    example: 404
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error interno del servidor
                  status:
                    type: integer
                    example: 500

    delete:
      summary: Borrar una cita
      tags:
        - Appointments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cita eliminada exitosamente
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error interno del servidor
                  status:
                    type: integer
                    example: 500

