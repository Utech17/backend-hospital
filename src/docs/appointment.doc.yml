                employee_id:
                  type: integer
                appointment_date:
                  type: string
                  format: date-time
                appointment_status:
                  type: string
                  enum: [Scheduled, Completed, Cancelled]
                appointment_area:
                  type: string
                  enum: [General, Specialty, Emergency]
      responses:
        '200':
          description: Cita actualizada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cita actualizada exitosamente
                  data:
                    type: object
                    properties:
                      appointment:
                        type: object
                        properties:
                          id:
                            type: integer
                          patient_id:
                            type: integer
                          employee_id:
                            type: integer
                          appointment_date:
                            type: string
                            format: date-time
                          appointment_status:
                            type: string
                            enum: [Scheduled, Completed, Cancelled]
                          appointment_area:
                            type: string
                            enum: [General, Specialty, Emergency]
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                          deletedAt:
                            type: string
                            format: date-time
                            nullable: true
        '400':
