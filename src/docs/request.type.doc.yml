/requesttype:
  get:
    summary: Obtener todos los tipos de solicitud
    tags:
      - Request Type
    description: Endpoint para obtener la lista de tipos de solicitud
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    requestTypes:
                      type: array
                      items:
                        type: object
                        properties:
                          request_type_id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "Solicitud de Compra"
                          bot:
                            type: boolean
                            example: true
                          department_id:
                            type: integer
                            example: 1
      '404':
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros no encontrados
                data:
                  type: array
                  items: {}
                  example: []
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  post:
    summary: Crear un nuevo tipo de solicitud
    tags:
      - Request Type
    description: Endpoint para crear un nuevo tipo de solicitud
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Solicitud de Compra"
              bot:
                type: boolean
                example: true
              department_id:
                type: integer
                example: 1
    responses:
      '201':
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Creación exitosa
                data:
                  type: object
                  properties:
                    requestType:
                      type: object
                      properties:
                        request_type_id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Solicitud de Compra"
                        bot:
                          type: boolean
                          example: true
                        department_id:
                          type: integer
                          example: 1
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Request Type Name is required"
                      path:
                        type: string
                        example: "name"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador

/requesttype/{id}:
  get:
    summary: Obtener un tipo de solicitud
    tags:
      - Request Type
    description: Endpoint para obtener un tipo de solicitud por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del tipo de solicitud
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro encontrado
                data:
                  type: object
                  properties:
                    requestType:
                      type: object
                      properties:
                        request_type_id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Solicitud de Compra"
                        bot:
                          type: boolean
                          example: true
                        department_id:
                          type: integer
                          example: 1
      '404':
        description: Registro no encontrado
        content:
