                      path:
                        type: string
                        example: "name"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  delete:
    summary: Eliminar un tipo de solicitud
    tags:
      - Request Type
    description: Endpoint para eliminar un tipo de solicitud por su id
    parameters:
      - in: path
        name: id
