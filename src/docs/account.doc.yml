/account:
  get:
    summary: Obtener todas las cuentas
    tags:
      - account
    description: Endpoint para obtener la lista de cuentas
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    accounts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "Cuenta Corriente"
                          type_account:
                            type: string
                            enum: ['current', 'savings']
                            example: "current"
                          status:
                            type: boolean
                            example: true
      '404':
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros no encontrados
                data:
                  type: array
                  items: {}
                  example: []
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  post:
    summary: Crear una nueva cuenta
    tags:
      - account
    description: Endpoint para crear una nueva cuenta
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Cuenta Corriente"
              type_account:
                type: string
                enum: ['current', 'savings']
                example: "current"
              status:
                type: boolean
                example: true
    responses:
      '201':
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Creación exitosa
                data:
                  type: object
                  properties:
                    account:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Cuenta Corriente"
                        type_account:
                          type: string
                          enum: ['current', 'savings']
                          example: "current"
                        status:
                          type: boolean
                          example: true
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Account Name is required"
                      path:
                        type: string
                        example: "name"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador

/account/{id}:
  get:
    summary: Obtener una cuenta
    tags:
      - account
    description: Endpoint para obtener una cuenta por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id de la cuenta
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro encontrado
                data:
                  type: object
                  properties:
                    account:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Cuenta Corriente"
                        type_account:
                          type: string
                          enum: ['current', 'savings']
                          example: "current"
                        status:
                          type: boolean
                          example: true
      '404':
        description: Registro no encontrado
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro no encontrado
                data:
                  type: object
                  properties: {}
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  put:
    summary: Actualizar una cuenta
    tags:
      - account
    description: Endpoint para actualizar una cuenta por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id de la cuenta
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: "Cuenta Corriente"
              type_account:
                type: string
                enum: ['current', 'savings']
                example: "current"
              status:
                type: boolean
                example: true
    responses:
      '200':
        description: Actualización exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Actualización exitosa
                data:
                  type: object
                  properties:
                    account:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Cuenta Corriente"
                        type_account:
                          type: string
                          enum: ['current', 'savings']
                          example: "current"
                        status:
                          type: boolean
                          example: true
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Account Name is required"
                      path:
                        type: string
                        example: "name"
                      location:
                        type: string
                        example: "body"
      '404':
        description: Registro no encontrado para actualizar
        content:
          application/json:
            schema:
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "El parametro id : 1, no existe en la base de datos."
                      path:
                        type: string
                        example: "id"
                      location:
                        type: string
                        example: "param"
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  delete:
    summary: Eliminar una cuenta
    tags:
      - account
    description: Endpoint para eliminar una cuenta
    parameters:
      - name: id
        in: path
        description: ID de la cuenta a eliminar
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Cuenta eliminada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Eliminación exitosa
      '404':
        description: Registro no encontrado para eliminar
        content:
          application/json:
            schema:
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "El parametro id : 1, no existe en la base de datos."
                      path:
                        type: string
                        example: "id"
                      location:
                        type: string
                        example: "param"
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador