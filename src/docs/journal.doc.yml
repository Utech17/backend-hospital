                  example: Contacte con el administrador
  put:
    summary: Actualizar un registro de diario
    tags:
      - journal
    description: Endpoint para actualizar un registro de diario por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del registro de diario
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id:
                type: integer
                example: 1
              account_record_id:
                type: integer
                example: 1
    responses:
      '200':
        description: Actualización exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Actualización exitosa
                data:
                  type: object
                  properties:
                    journal:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        request_id:
                          type: integer
                          example: 1
