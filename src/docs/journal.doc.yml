        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  delete:
    summary: Eliminar un registro de diario
    tags:
      - journal
    description: Endpoint para eliminar un registro de diario
    parameters:
      - name: id
        in: path
        description: ID del registro de diario a eliminar
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Registro de diario eliminado exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Eliminación exitosa
