/journal:
  get:
    summary: Obtener todos los registros de diario
    tags:
      - journal
    description: Endpoint para obtener la lista de registros de diario
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    journals:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          request_id:
                            type: integer
                            example: 1
                          account_record_id:
                            type: integer
                            example: 1
                          createdAt:
                            type: string
                            format: date-time
                            example: "2024-01-01T00:00:00.000Z"
                          updatedAt:
                            type: string
                            format: date-time
                            example: "2024-01-01T00:00:00.000Z"
                          deletedAt:
                            type: string
                            format: date-time
                            example: "2024-01-01T00:00:00.000Z"
      '404':
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros no encontrados
                data:
                  type: array
                  items: {}
                  example: []
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  post:
    summary: Crear un nuevo registro de diario
    tags:
      - journal
    description: Endpoint para crear un nuevo registro de diario
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              request_id:
                type: integer
                example: 1
              account_record_id:
                type: integer
                example: 1
    responses:
      '201':
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Creación exitosa
                data:
                  type: object
                  properties:
                    journal:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        request_id:
                          type: integer
                          example: 1
                        account_record_id:
                          type: integer
                          example: 1
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        deletedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Request ID is required"
                      path:
                        type: string
                        example: "request_id"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador

/journal/{id}:
  get:
    summary: Obtener un registro de diario
    tags:
      - journal
    description: Endpoint para obtener un registro de diario por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del registro de diario
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro encontrado
                data:
                  type: object
                  properties:
                    journal:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        request_id:
                          type: integer
                          example: 1
                        account_record_id:
                          type: integer
                          example: 1
                        createdAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        deletedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
      '404':
        description: Registro no encontrado
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro no encontrado
                data:
                  type: object
                  properties: {}
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
