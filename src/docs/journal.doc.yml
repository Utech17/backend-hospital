                      location:
                        type: string
                        example: "body"
      '404':
        description: Registro no encontrado para actualizar
        content:
          application/json:
            schema:
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "El parametro id : 1, no existe en la base de datos."
                      path:
                        type: string
                        example: "id"
                      location:
                        type: string
                        example: "param"
