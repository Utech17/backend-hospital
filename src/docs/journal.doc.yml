/journal/excel:
  post:
    summary: Generar archivo Excel
    tags:
      - journal
    description: Endpoint para generar un archivo Excel con los registros contables
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              startDate:
                type: string
                format: date
                example: "2024-01-01"
              endDate:
                type: string
                format: date
                example: "2024-12-31"
    responses:
      '200':
        description: Excel generado exitosamente
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Error en los parámetros de entrada
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador

/journal/dates:
  get:
    summary: Obtener fechas mínima y máxima
    tags:
      - journal
    description: Endpoint para obtener la fecha mínima y máxima de los registros de diario
    produces:
      - application/json
    responses:
      '200':
        description: Fechas obtenidas exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Fechas obtenidas exitosamente
                data:
                  type: object
                  properties:
                    minDate:
                      type: string
                      format: date
                      example: "2024-01-01"
                    maxDate:
                      type: string
                      format: date
                      example: "2024-12-31"
      '404':
        description: No se encontraron fechas
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: No se encontraron fechas
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador