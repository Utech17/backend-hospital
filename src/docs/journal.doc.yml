                        example: "field"
                      msg:
                        type: string
                        example: "El parametro id : 1, no existe en la base de datos."
                      path:
                        type: string
                        example: "id"
                      location:
                        type: string
                        example: "param"
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador