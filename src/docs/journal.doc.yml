                        updatedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
                        deletedAt:
                          type: string
                          format: date-time
                          example: "2024-01-01T00:00:00.000Z"
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
