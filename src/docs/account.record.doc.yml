      - accountrecord
    description: Endpoint para obtener un registro de cuenta por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id del registro de cuenta
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
