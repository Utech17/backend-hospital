/accountrecord:
  get:
    summary: Obtener todos los registros de cuenta
    tags:
      - accountrecord
    description: Endpoint para obtener la lista de registros de cuenta
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    accountRecords:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          type:
                            type: string
                            enum: ['D', 'H']
                            example: "D"
                          description:
                            type: string
                            example: "Registro de Banco"
                          amount:
                            type: number
                            format: double
                            example: 1500.50
                          account_id:
                            type: integer
                            example: 1
                          status:
                            type: boolean
                            example: true
      '404':
        description: Registros no encontrados
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros no encontrados
                data:
                  type: array
                  items: {}
                  example: []
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador
  post:
    summary: Crear un nuevo registro de cuenta
    tags:
      - accountrecord
    description: Endpoint para crear un nuevo registro de cuenta
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                enum: ['D', 'H']
                example: "D"
              description:
                type: string
                example: "Registro de Banco"
              amount:
                type: number
                format: double
                example: 1500.50
              account_id:
                type: integer
                example: 1
              status:
                type: boolean
                example: true
    responses:
      '201':
        description: Creación exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Creación exitosa
                data:
                  type: object
                  properties:
                    accountRecord:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        type:
                          type: string
                          enum: ['D', 'H']
                          example: "D"
                        description:
                          type: string
                          example: "Registro de Banco"
                        amount:
                          type: number
                          format: double
                          example: 1500.50
                        account_id:
                          type: integer
                          example: 1
                        status:
                          type: boolean
                          example: true
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: "field"
                      msg:
                        type: string
                        example: "Type is required"
                      path:
                        type: string
                        example: "type"
                      location:
                        type: string
                        example: "body"
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Contacte con el administrador

/accountrecord/{id}:
  get:
    summary: Obtener un registro de cuenta
