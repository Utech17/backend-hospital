/patient:
  get:
    summary: "Obtener Pacientes"
    tags:
      - "Pacientes"
    description: "Endpoint para obtener la lista de pacientes"
    produces:
      - "application/json"
    responses:
      "200":
        description: "Respuesta exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Registros encontrados exitosamente"
                data:
                  type: "object"
                  properties:
                    patients:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            example: 1
                          nickname:
                            type: "string"
                            example: "Mike"
                          firstName:
                            type: "string"
                            example: "Maikel"
                          lastName:
                            type: "string"
                            example: "Perez"
                          birthDate:
                            type: "string"
                            format: "date-time"
                            example: "1990-05-22T00:00:00.000Z"
                          gender:
                            type: "string"
                            example: "Male"
                          identifier:
                            type: "string"
                            example: "2233495566"
                          registrationDate:
                            type: "string"
                            format: "date-time"
                            example: "2024-01-02T10:30:00.000Z"
                          updatedAt:
                            type: "string"
                            format: "date-time"
                            example: "2024-01-02T10:30:00.000Z"
                          deletedAt:
                            type: "string"
                            format: "null"
                            example: null
                          createdAt:
                            type: "string"
                            format: "date-time"
                            example: "2025-02-04T04:06:17.000Z"
      "404":
        description: "Registros no encontrados"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Registros no encontrados"
                data:
                  type: "object"
                  properties:
                    patients:
                      type: "array"
                      items: {}
                      example: []
      "500":
        description: "Error interno del servidor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
  post:
    summary: "Crear un nuevo Paciente"
    tags:
      - "Pacientes"
    description: "Endpoint para crear un nuevo paciente"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: "object"
            properties:
              nickname:
                type: "string"
                example: "Mike"
              firstName:
                type: "string"
                example: "Maikel"
              lastName:
                type: "string"
                example: "Perez"
              birthDate:
                type: "string"
                format: "date-time"
                example: "1990-05-22T00:00:00.000Z"
              gender:
                type: "string"
                example: "Male"
              identifier:
                type: "string"
                example: "2233495566"
              registrationDate:
                type: "string"
                format: "date-time"
                example: "2024-01-02T10:30:00.000Z"
              updatedAt:
                type: "string"
                format: "date-time"
                example: "2024-01-02T10:30:00.000Z"
              deletedAt:
                type: "string"
                format: "null"
                example: null
              createdAt:
                type: "string"
                format: "date-time"
                example: "2025-02-04T04:06:17.000Z"
    responses:
      201:
        description: "Creación exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Creacion exitosa"
                data:
                  type: "object"
                  properties:
                    patient:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
                          example: 16
                        nickname:
                          type: "string"
                          example: "Mike"
                        firstName:
                          type: "string"
                          example: "Maikel"
                        lastName:
                          type: "string"
                          example: "Perez"
                        birthDate:
                          type: "string"
                          format: "date-time"
                          example: "1990-05-22T00:00:00.000Z"
                        gender:
                          type: "string"
                          example: "Male"
                        identifier:
                          type: "string"
                          example: "2233495566"
                        registrationDate:
                          type: "string"
                          format: "date-time"
                          example: "2024-01-02T10:30:00.000Z"
                        updatedAt:
                          type: "string"
                          format: "date-time"
                          example: "2024-01-02T10:30:00.000Z"
                        deletedAt:
                          type: "string"
                          format: "null"
                          example: null
                        createdAt:
                          type: "string"
                          format: "date-time"
                          example: "2025-02-04T04:06:17.000Z"
      400:
        description: "Error en la solicitud"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                errors:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      type:
                        type: "string"
                        example: "field"
                      msg:
                        type: "string"
                        example: "Nickname is required"
                      path:
                        type: "string"
                        example: "nickname"
                      location:
                        type: "string"
                        example: "body"
      500:
        description: "Error del servidor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
