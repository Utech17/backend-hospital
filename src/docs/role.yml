openapi: 3.0.0
info:
  title: Hospital Backend API
  description: API documentation for the Hospital Backend
  version: 1.0.0

paths:
  /role:
    get:
      summary: Obtener todos los roles
      responses:
        '200':
          description: Respuesta Exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      Roles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '404':
          description: Resultados no encontrados
        '500':
          description: Error interno del servidor
    post:
      summary: Crear nuevo rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Creación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Error de validacion
        '500':
          description: Error interno del servidor

  /role/{id}:
    get:
      summary: Obtener rol por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Respuesta Exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          description: Rol no encontrado
        '500':
          description: Error interno del servidor
    put:
      summary: Actualizar un rol
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Actualización exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Error de validacion
        '404':
          description: Rol no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Eliminar un rol
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminación exitosa
        '404':
          description: Rol no encontrado
        '500':
          description: Error interno del servidor

components:
  schemas:
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
    RoleInput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
    RoleResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            Role:
              $ref: '#/components/schemas/Role'



