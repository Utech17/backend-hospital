/payroll:
  get:
    summary: Obtener todas las nóminas
    tags:
      - payroll
    description: Endpoint para obtener la lista de todas las nóminas
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    payrolls:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          employee_id:
                            type: integer
                            example: 1
                          startDate:
                            type: string
                            format: date-time
                            example: 2024-01-01T00:00:00.000Z
                          endDate:
                            type: string
                            format: date-time
                            example: 2024-01-15T00:00:00.000Z
                          grossSalary:
                            type: string
                            example: "1500.00"
                          deductions:
                            type: string
                            example: "300.00"
                          netSalary:
                            type: string
                            example: "1200.00"
                          createdAt:
                            type: string
                            format: date-time
                            example: 2025-02-03T17:41:27.000Z
                          updatedAt:
                            type: string
                            format: date-time
                            example: 2025-02-03T17:41:27.000Z
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Error en la solicitud
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        example: "employee_id"
                      message:
                        type: string
                        example: "El campo employee_id es requerido"
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador

/payroll/{id}:
  get:
    summary: Obtener una nómina
    tags:
      - payroll
    description: Endpoint para obtener una nómina por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id de la nómina
        schema:
          type: integer
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro encontrado
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    employee_id:
                      type: integer
                      example: 1
                    startDate:
                      type: string
                      format: date-time
                      example: 2024-01-01T00:00:00.000Z
                    endDate:
                      type: string
                      format: date-time
                      example: 2024-01-15T00:00:00.000Z
                    grossSalary:
                      type: string
                      example: "1500.00"
                    deductions:
                      type: string
                      example: "300.00"
                    netSalary:
                      type: string
                      example: "1200.00"
                    createdAt:
                      type: string
                      format: date-time
                      example: 2025-02-03T17:41:27.000Z
                    updatedAt:
                      type: string
                      format: date-time
                      example: 2025-02-03T17:41:27.000Z
      '404':
        description: Registro no encontrado
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro no encontrado
                data:
                  type: object
                  properties: {}
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador
  put:
    summary: Actualizar una nómina
    tags:
      - payroll
    description: Endpoint para actualizar una nómina por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id de la nómina
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              employee_id:
                type: integer
                example: 1
              startDate:
                type: string
                format: date-time
                example: 2024-01-01T00:00:00.000Z
              endDate:
                type: string
                format: date-time
                example: 2024-01-15T00:00:00.000Z
              grossSalary:
                type: string
                example: "1500.00"
              deductions:
                type: string
                example: "300.00"
              netSalary:
                type: string
                example: "1200.00"
    responses:
      '200':
        description: Actualización exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Actualización exitosa
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    employee_id:
                      type: integer
                      example: 1
                    startDate:
                      type: string
                      format: date-time
                      example: 2024-01-01T00:00:00.000Z
                    endDate:
                      type: string
                      format: date-time
                      example: 2024-01-15T00:00:00.000Z
                    grossSalary:
                      type: string
                      example: "1500.00"
                    deductions:
                      type: string
                      example: "300.00"
                    netSalary:
                      type: string
                      example: "1200.00"
                    createdAt:
                      type: string
                      format: date-time
                      example: 2025-02-03T17:41:27.000Z
                    updatedAt:
                      type: string
                      format: date-time
                      example: 2025-02-03T17:41:27.000Z
      '400':
        description: Error en la solicitud
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Error en la solicitud
                errors:
                  type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        example: "employee_id"
                      message:
                        type: string
                        example: "El campo employee_id es requerido"
      '404':
        description: Registro no encontrado para actualizar
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro no encontrado
                data:
                  type: object
                  properties: {}
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador
  delete:
    summary: Eliminar una nómina
    tags:
      - payroll
    description: Endpoint para eliminar una nómina por su id
    parameters:
      - in: path
        name: id
        required: true
        description: Id de la nómina
        schema:
          type: integer
    responses:
      '200':
        description: Nómina eliminada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Eliminado exitosamente
      '404':
        description: Registro no encontrado para eliminar
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro no encontrado
                data:
                  type: object
                  properties: {}
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador