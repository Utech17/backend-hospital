
  /api/payroll:
    get:
      summary: obtener todas las nominas
      tags: [ Payroll ]
      responses: endpoint para ver los registros de nómina
    '200':
      description: Registros encontrados
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Registros encontrados
              data:
                type: object
                properties:
                  payrolls:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        employee_id:
                          type: integer
                          example: 1
                        startDate:
                          type: string
                          format: date-time
                          example: 2024-01-01T00:00:00.000Z
                        endDate:
                          type: string
                          format: date-time
                          example: 2024-01-15T00:00:00.000Z
                        grossSalary:
                          type: string
                          example: "1500.00"
                        deductions:
                          type: string
                          example: "300.00"
                        netSalary:
                          type: string
                          example: "1200.00"
                        createdAt:
                          type: string
                          format: date-time
                          example: 2025-02-03T17:41:27.000Z
                        updatedAt:
                          type: string
                          format: date-time
                          example: 2025-02-03T17:41:27.000Z
    '400':
      description: Error en la solicitud
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Error en la solicitud
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: employee_id
                    message:
                      type: string
                      example: El campo employee_id es inválido o está vacío
    '500':
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Error interno del servidor
              details:
                type: string
                example: Ocurrió un error inesperado al intentar recuperar los registros
