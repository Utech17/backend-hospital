/payroll:
  get:
    summary: Obtener todas las nóminas
    tags:
      - payroll
    description: Endpoint para obtener la lista de todas las nóminas
    produces:
      - application/json
    responses:
      '200':
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registros encontrados exitosamente
                data:
                  type: object
                  properties:
                    payrolls:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          employee_id:
                            type: integer
                            example: 1
                          startDate:
                            type: string
                            format: date-time
                            example: 2024-01-01T00:00:00.000Z
                          endDate:
                            type: string
                            format: date-time
                            example: 2024-01-15T00:00:00.000Z
                          grossSalary:
                            type: string
                            example: "1500.00"
                          deductions:
                            type: string
                            example: "300.00"
                          netSalary:
                            type: string
                            example: "1200.00"
                          status:
                            type: boolean
                            example: true
                          payroll_details:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                concept_id:
                                  type: integer
                                  example: 1
                                payroll_id:
                                  type: integer
                                  example: 1
                                amount:
                                  type: string
                                  example: "100.00"
                                concept:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 1
                                    name:
                                      type: string
                                      example: "Sueldo Base"
                                    concept_type:
                                      type: string
                                      example: "type1"
                                    formula:
                                      type: string
                                      example: "1.00"
                                    description:
                                      type: string
                                      example: "Compensación fija mensual o quincenal por el trabajo realizado."
  post:
    summary: Crear una nueva nómina
    tags:
      - payroll
    description: Endpoint para crear una nueva nómina
    consumes:
      - application/json
    produces:
      - application/json
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              employee_id:
                type: integer
                example: 1
              startDate:
                type: string
                format: date-time
                example: 2024-01-01T00:00:00.000Z
              endDate:
                type: string
                format: date-time
                example: 2024-01-15T00:00:00.000Z
              grossSalary:
                type: string
                example: "1500.00"
              deductions:
                type: string
                example: "300.00"
              netSalary:
                type: string
                example: "1200.00"
              details:
                type: array
                items:
                  type: object
                  properties:
                    concept_id:
                      type: integer
                      example: 1
                    amount:
                      type: string
                      example: "100.00"
    responses:
      '201':
        description: Nómina creada exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Nómina creada exitosamente con detalles y conceptos
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    employee_id:
                      type: integer
                      example: 1
                    startDate:
                      type: string
                      format: date-time
                      example: 2024-01-01T00:00:00.000Z
                    endDate:
                      type: string
                      format: date-time
                      example: 2024-01-15T00:00:00.000Z
                    grossSalary:
                      type: string
                      example: "1500.00"
                    deductions:
                      type: string
                      example: "300.00"
                    netSalary:
                      type: string
                      example: "1200.00"
                    status:
                      type: boolean
                      example: true
                    payroll_details:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          concept_id:
                            type: integer
                            example: 1
                          payroll_id:
                            type: integer
                            example: 1
                          amount:
                            type: string
                            example: "100.00"
                          concept:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: "Sueldo Base"
                              concept_type:
                                type: string
                                example: "type1"
                              formula:
                                type: string
                                example: "1.00"
                              description:
                                type: string
                                example: "Compensación fija mensual o quincenal por el trabajo realizado."
  put:
    summary: Actualizar una nómina existente
    tags:
      - payroll
    description: Endpoint para actualizar una nómina existente
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la nómina a actualizar
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              employee_id:
                type: integer
                example: 1
              startDate:
                type: string
                format: date-time
                example: 2024-01-01T00:00:00.000Z
              endDate:
                type: string
                format: date-time
                example: 2024-01-15T00:00:00.000Z
              grossSalary:
                type: string
                example: "1500.00"
              deductions:
                type: string
                example: "300.00"
              netSalary:
                type: string
                example: "1200.00"
              details:
                type: array
                items:
                  type: object
                  properties:
                    concept_id:
                      type: integer
                      example: 1
                    amount:
                      type: string
                      example: "100.00"
    responses:
      '200':
        description: Registro actualizado exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro actualizado exitosamente
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    employee_id:
                      type: integer
                      example: 1
                    startDate:
                      type: string
                      format: date-time
                      example: 2024-01-01T00:00:00.000Z
                    endDate:
                      type: string
                      format: date-time
                      example: 2024-01-15T00:00:00.000Z
                    grossSalary:
                      type: string
                      example: "1500.00"
                    deductions:
                      type: string
                      example: "300.00"
                    netSalary:
                      type: string
                      example: "1200.00"
                    status:
                      type: boolean
                      example: true
                    payroll_details:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          concept_id:
                            type: integer
                            example: 1
                          payroll_id:
                            type: integer
                            example: 1
                          amount:
                            type: string
                            example: "100.00"
                          concept:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              name:
                                type: string
                                example: "Sueldo Base"
                              concept_type:
                                type: string
                                example: "type1"
                              formula:
                                type: string
                                example: "1.00"
                              description:
                                type: string
                                example: "Compensación fija mensual o quincenal por el trabajo realizado."
  delete:
    summary: Eliminar una nómina existente
    tags:
      - payroll
    description: Endpoint para eliminar una nómina existente
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: ID de la nómina a eliminar
    responses:
      '200':
        description: Registro eliminado exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Registro eliminado exitosamente
      '500':
        description: Error del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: Por favor contacte al administrador