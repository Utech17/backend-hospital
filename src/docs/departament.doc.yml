/departament:
  get:
    summary: "Obtener departamentos"
    tags:
      - "Departament"
    description: "Endpoint para obtener la lista de departamentos"
    produces:
      - "application/json"
    responses:
      "200":
        description: "Respuesta exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Departamentos encontrados"
                data:
                  type: "object"
                  properties:
                    departament:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            example: 1
                          name:
                            type: "string"
                            example: "Laboratorio"
                          description:
                            type: "string"
                            format: "procesos de labortorio"
                            example: procesos de labortorio
                          status:
                            type: "boolean"
                            example: true
                          createdAt:
                            type: "string"
                            format: "date-time"
                            example: "2024-12-13T01:24:41.000Z"
                          updatedAt:
                            type: "string"
                            format: "date-time"
                            example: "2024-12-13T01:24:41.000Z"
      "404":
        description: "Registros no encontrados"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Departamentos no encontrados"
                data:
                  type: "object"
                  properties:
                    departament:
                      type: "array"
                      items: {}
                      example: []
      "500":
        description: "Error interno del servidor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
  post:
    summary: "Crear un nuevo departamento"
    tags:
      - "Departament" 
    description: "Endpoint para crear un nuevo departamento"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: "object"
            properties:
              name:
                type: "string"
                example: "Gastroenterologia"
    responses:
      201:
        description: "Creación exitosa"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Creación exitosa"
                data:
                  type: "object"
                  properties:
                    departament:
                      type: "object"
                      properties:
                        status:
                          type: "boolean"
                          example: true
                        id:
                          type: "integer"
                          example: 21
                        name:
                          type: "string"
                          example: "Gastroenterologia"
                        description:
                          type: "string"
                          format: "procesos de gastro"
                          example: procesos de gastro                          
                        updatedAt:
                          type: "string"
                          format: "date-time"
                          example: "2025-02-01T00:20:51.550Z"
                        createdAt:
                          type: "string"
                          format: "date-time"
                          example: "2025-02-01T00:20:51.550Z"
      400:
        description: "Error en la solicitud"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                errors:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      type:
                        type: "string"
                        example: "field"
                      msg:
                        type: "string"
                        example: "departament Name is required"
                      path:
                        type: "string"
                        example: "name"
                      location:
                        type: "string"
                        example: "body"
      500:
        description: "Error del servidor"
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  example: "Contacte con el administrador"
/departament/{id}:
